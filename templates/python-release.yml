# Caller templates for a Python repository's release path — two files.
#
# Copy the first block to .github/workflows/release-please.yml and the second to
# .github/workflows/relock-release-pr.yml.
#
# Python uses release-type "simple" with an extra-files updater rather than the
# built-in python strategy, which documents setup.py and setup.cfg and does not
# state whether it writes a PEP 621 [project] version:
#
#   release-please-config.json:
#     { "$schema": "https://raw.githubusercontent.com/googleapis/release-please/main/schemas/config.json",
#       "packages": { ".": { "release-type": "simple",
#         "extra-files": [ { "type": "toml", "path": "pyproject.toml",
#                            "jsonpath": "$.project.version" } ] } } }
#
#   .release-please-manifest.json:
#     { ".": "0.1.0" }        # seed with the current version
#
# The relock workflow is required, not optional: release-please does not
# regenerate uv.lock, and the lock records the package's own version.

# ---------- .github/workflows/release-please.yml ----------
name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    uses: tftio/gh-actions/.github/workflows/release-please.yml@v2.0.0
    secrets:
      RELEASE_BOT_APP_ID: ${{ secrets.RELEASE_BOT_APP_ID }}
      RELEASE_BOT_PRIVATE_KEY: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

