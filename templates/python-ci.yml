# Caller template: copy to .github/workflows/ci.yml in a Python repository.
#
# Content-mode repositories -- ones whose toolchain lints prose and configuration
# rather than building a package -- pass `gate-task: check` instead of the default
# `ci`, matching the mode the GitLab component called content mode.

name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    uses: tftio/gh-actions/.github/workflows/python-ci.yml@v1.1.0
    # with:
    #   gate-task: check
    # A repository that fetches a private tftio repository over SSH -- a cargo git
    # dependency, or a mise tool built from one -- passes a read-only deploy key
    # for it. See "Private git dependencies over SSH" in the gh-actions README.
    # secrets:
    #   ssh-private-key: ${{ secrets.PLANNER_DEPLOY_KEY }}
