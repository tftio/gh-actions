# Caller template: copy to .github/workflows/release.yml in a Rust repository.
#
# Runs only on the default branch. cog decides whether the accumulated commits
# warrant a release; when they do not, the job succeeds having done nothing, which
# is why this is safe to run on every push to main.
#
# `publish: true` belongs only in repositories that actually go to crates.io --
# clanker, kb, prompter, silent-critic, tftio-lib and tftio-org at the time of the
# migration. Declaring it without a CARGO_REGISTRY_TOKEN secret fails the job
# before any version is computed, rather than cutting a tag whose publication step
# then fails.

name: release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    uses: tftio/gh-actions/.github/workflows/rust-release.yml@v1.1.0
