# Caller templates for a Rust repository's release path — two files.
#
# release-please opens the release PR; a separate workflow builds what the merged
# release names. Copy the first block to .github/workflows/release-please.yml and
# the second to .github/workflows/release.yml.
#
# The repository also needs release-please-config.json and
# .release-please-manifest.json. SEED THE MANIFEST with the current version or
# releases restart from 0.0.0:
#
#   release-please-config.json:
#     { "$schema": "https://raw.githubusercontent.com/googleapis/release-please/main/schemas/config.json",
#       "packages": { ".": { "release-type": "rust" } } }
#
#   .release-please-manifest.json:
#     { ".": "1.0.0" }
#
# release-type rust updates Cargo.toml, Cargo.lock and CHANGELOG.md, so no relock
# workflow is needed.

# ---------- .github/workflows/release-please.yml ----------
name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    uses: tftio/gh-actions/.github/workflows/release-please.yml@v2.0.0
    secrets:
      RELEASE_BOT_APP_ID: ${{ secrets.RELEASE_BOT_APP_ID }}
      RELEASE_BOT_PRIVATE_KEY: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

