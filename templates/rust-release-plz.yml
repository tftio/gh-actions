# Copy to .github/workflows/release-plz.yml and copy release-plz.toml beside
# Cargo.toml. Pin a published immutable gh-actions tag that contains the workflow.
# Remove the old release-please caller/config/manifest in the same change.
# Do not add workflow-level concurrency: it can drop a pending release run.
# Set `id-token: write` so an opted-in crate can use crates.io trusted publishing;
# release-plz obtains a short-lived token only when release-plz.toml enables publish.
name: release-plz

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  release-plz:
    uses: tftio/gh-actions/.github/workflows/release-plz.yml@vX.Y.Z
    with:
      app-id: ${{ vars.RELEASE_BOT_APP_ID }}
    secrets:
      RELEASE_BOT_PRIVATE_KEY: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
